services:
  postgres:
    image: postgres:15
    restart: always
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    env_file:
      - ../.env
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers/servers.json:/pgadmin4/servers.json:ro
      - ./pgpassfile:/pgpass/pgpassfile:ro

  minio:
    image: minio/minio
    container_name: minio
    env_file:
      - ../.env
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: circle-of-life-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ../app:/app
      - ../db:/db
      - ../app/tests:/app/tests
      - ../.env:/.env
    depends_on:
      - postgres
      - minio

volumes:
  pgdata:
  minio-data:
  pgadmin-data:
