version: "3.8"
services:
  postgres:
    image: postgres:15
    restart: always
    env_file:
      - ../.env         # <-- reads DB_USER, DB_PASSWORD, DB_NAME
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: saravanamuthu@throughbit.com
      PGADMIN_DEFAULT_PASSWORD: nimda
    ports:
      - "5050:80"

  minio:
    image: minio/minio
    container_name: minio
    env_file:
      - ../.env         # <-- reads S3_ACCESS_KEY, S3_SECRET_KEY
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: circle-of-life-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ../app:/app
      - ../db:/db
      - ../.env:/.env     # <-- mount local .env with real credentials
    depends_on:
      - postgres
      - minio

volumes:
  pgdata:
  minio-data:
